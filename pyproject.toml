[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aimo_interp"]

[project]
name = "aimo-interp-getting-started"
version = "1.0.0"
description = "AIMO Interpretability Challenge — getting-started kit and local evaluation harness"
requires-python = ">=3.11"
# Exact versions from Dockerfile.competition, the evaluation runtime. Train and
# serialize your artifacts against these so they load identically on Codabench.
# torch is version-pinned but not build-pinned: the evaluation image ships the
# CUDA build, while `uv sync` on a laptop installs the default wheel for your
# platform, which also runs on CPU.
dependencies = [
    "accelerate==1.13.0",
    "huggingface-hub==1.22.0",
    "joblib==1.5.3",
    "pandas==3.0.3",
    "safetensors==0.8.0",
    "scikit-learn==1.8.0",
    "tokenizers==0.22.2",
    "transformers==5.13.0",
    "torch~=2.12.1",
]

# Local tooling only — NOT part of the evaluation runtime. pyarrow lets the
# dataset importer read the private dataset's parquet files.
[dependency-groups]
# Optional local compiler tooling for scripts/install_fast_kernels.sh.
cuda-build = [
    "cuda-toolkit[cccl,crt,cudart,nvcc,nvvm]==13.0.2",
    "ninja>=1.13.2",
    "setuptools>=70",
    "wheel>=0.48.0",
]
dev = [
    "pyarrow>=17",
]
# Local notebook execution and quantization; not submission dependencies.
notebooks = [
    "bitsandbytes>=0.50.2",
    "causal-conv1d>=1.7.0",
    "flash-linear-attention>=0.5.2",
    "ipykernel>=7.4.0",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
]
