[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aimo_interp"]

[project]
name = "aimo-interp-getting-started"
version = "1.0.0"
description = "AIMO Interpretability Challenge — getting-started kit and local evaluation harness"
requires-python = ">=3.11"
# Core runtime versions match Dockerfile.competition. Notebook and CUDA build
# tools are installed alongside them locally; the competition image is unchanged.
# torch is version-pinned but not build-pinned: the evaluation image ships the
# CUDA build, while `uv sync` on a laptop installs the default wheel for your
# platform, which also runs on CPU.
# One environment for inference, notebooks, data processing and CUDA builds.
dependencies = [
    "accelerate==1.13.0",
    "huggingface-hub==1.22.0",
    "joblib==1.5.3",
    "pandas==3.0.3",
    "safetensors==0.8.0",
    "scikit-learn==1.8.0",
    "tokenizers==0.22.2",
    "transformers==5.13.0",
    "torch~=2.12.1",
    "cuda-toolkit[cccl,crt,cudart,nvcc,nvvm]==13.0.2",
    "ninja>=1.13.2",
    "setuptools>=70",
    "wheel>=0.48.0",
    "pyarrow>=17",
    "bitsandbytes>=0.50.2",
    "causal-conv1d>=1.7.0",
    "flash-linear-attention>=0.5.2",
    "ipykernel>=7.4.0",
    "math-verify[antlr4-13-2]>=0.8.0",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
]
